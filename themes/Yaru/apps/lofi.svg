<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E2750"/>
      <stop offset="50%" stop-color="#77216F"/>
      <stop offset="100%" stop-color="#E95420"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Highlight Border -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Headphone Band -->
  <path d="M 38 66 A 26 26 0 0 1 90 66" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Left Ear Cup -->
  <rect x="32" y="60" width="12" height="26" rx="6" ry="6" fill="#FFFFFF"/>
  <rect x="30" y="64" width="5" height="18" rx="2" ry="2" fill="#FFA500"/>
  
  <!-- Right Ear Cup -->
  <rect x="84" y="60" width="12" height="26" rx="6" ry="6" fill="#FFFFFF"/>
  <rect x="93" y="64" width="5" height="18" rx="2" ry="2" fill="#FFA500"/>
  
  <!-- Music Note / Audio Waves in Center -->
  <path d="M 54 82 L 54 62 L 72 58 L 72 78" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="82" r="5" fill="#FFFFFF"/>
  <circle cx="68" cy="78" r="5" fill="#FFFFFF"/>
  
  <!-- Sound Waves -->
  <path d="M 48 42 A 20 20 0 0 1 80 42" fill="none" stroke="#FFA500" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M 54 36 A 14 14 0 0 1 74 36" fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
</svg>
